<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drake Admin - Protected</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #14161d;
      --text-muted: #8e94a0;
      --border-color: #242834;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg-color); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .admin-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; width: 100%; max-width: 420px; display: none; }
    .login-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; width: 100%; max-width: 420px; text-align: center; }
    .title { font-size: 16px; font-weight: 900; letter-spacing: 1px; text-align: center; margin-bottom: 5px; }
    .subtitle { font-size: 10px; color: var(--text-muted); text-align: center; margin-bottom: 20px; letter-spacing: 1px; }
    
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 6px; font-weight: 700; }
    
    select, input { width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); color: #fff; border-radius: 8px; font-size: 13px; outline: none; }
    
    .btn { background: #fff; color: #000; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: 800; cursor: pointer; margin-top: 5px; letter-spacing: 1px; }
    
    .result-box { margin-top: 20px; background: var(--bg-color); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; text-align: center; font-family: monospace; font-size: 14px; color: #00ff66; letter-spacing: 1px; }
  </style>
</head>
<body>

<!-- PASSWORD LOGIN SCREEN -->
<div class="login-box" id="login-screen">
  <div class="title">ADMIN ACCESS</div>
  <div class="subtitle">ENTER PASSWORD TO CONTINUE</div>
  <div class="form-group">
    <label>ADMIN PASSWORD</label>
    <input type="password" id="admin-pass" placeholder="Enter password...">
  </div>
  <button class="btn" onclick="checkPassword()">LOGIN</button>
</div>

<!-- ACTUAL ADMIN PANEL (HIDDEN UNTIL PASSWORD IS CORRECT) -->
<div class="admin-box" id="admin-panel">
  <div class="title">DRAKE ADMIN PANEL</div>
  <div class="subtitle">GENERATE TIMED ACCESS KEYS</div>

  <div class="form-group">
    <label>SELECT KEY VALIDITY / DURATION</label>
    <select id="duration-select">
      <option value="1">1 Hour</option>
      <option value="2">2 Hours</option>
      <option value="6">6 Hours</option>
      <option value="12">12 Hours</option>
      <option value="24" selected>1 Day (24 Hours)</option>
      <option value="72">3 Days</option>
      <option value="168">7 Days (1 Week)</option>
      <option value="720">30 Days (1 Month)</option>
    </select>
  </div>

  <button class="btn" onclick="generateKey()">GENERATE KEY</button>

  <div class="result-box" id="result-key">DRKE-XXXX-XXXX-XXXX</div>
</div>

<script>
  // Yahan apna pasandida password set kar sakte hain (jaise: "aditya123")
  const ADMIN_PASSWORD = "admin"; 

  function checkPassword() {
    const enteredPass = document.getElementById('admin-pass').value;
    if (enteredPass === ADMIN_PASSWORD) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
    } else {
      alert("Incorrect Password!");
    }
  }

  function generateKey() {
    const duration = document.getElementById('duration-select').value;

    fetch('/api/generate-key', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ duration: parseInt(duration) })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        document.getElementById('result-key').innerText = data.key;
      } else {
        alert("Error generating key!");
      }
    });
  }
</script>

</body>
</html>

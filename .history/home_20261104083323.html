<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drake Panel - Home</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #14161d;
      --text-muted: #8e94a0;
      --border-color: #242834;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg-color); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 420px; height: 100vh; max-height: 850px; background: var(--bg-color); border: 1px solid var(--border-color); display: flex; flex-direction: column; position: relative; overflow: hidden; }
    
    .header { padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); font-size: 14px; font-weight: 900; letter-spacing: 1px; }
    .header-right { display: flex; align-items: center; gap: 15px; font-size: 11px; color: var(--text-muted); }
    
    .content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 80px; }

    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 9px; color: var(--text-muted); margin-bottom: 10px; letter-spacing: 0.5px; font-weight: bold; }
    
    /* Circular Dial Timer Section */
    .timer-section { text-align: center; margin: 10px 0 20px 0; position: relative; padding: 30px 0; background: radial-gradient(circle, rgba(20,22,29,0.6) 0%, rgba(11,12,16,0) 70%); }
    .dial-ring { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 220px; height: 220px; border: 1px dashed rgba(142, 148, 160, 0.3); border-radius: 50%; display: flex; justify-content: center; align-items: center; pointer-events: none; }
    .skull-icon { font-size: 40px; margin-bottom: 2px; }
    .timer-val { font-size: 32px; font-weight: 900; letter-spacing: 1.5px; margin-top: 2px; }
    .timer-label { font-size: 9px; color: var(--text-muted); letter-spacing: 1.5px; margin-top: 4px; font-weight: bold; }

    /* Key Box */
    .key-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-family: monospace; font-size: 12px; letter-spacing: 1px; }
    .key-box span { color: #fff; font-weight: bold; }
    .copy-btn { background: #1f232d; border: 1px solid var(--border-color); color: #fff; padding: 6px 14px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; letter-spacing: 0.5px; }

    /* Info Grid */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr 1.1fr; gap: 8px; margin-bottom: 20px; }
    .info-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 12px 8px; border-radius: 8px; text-align: left; }
    .info-card label { display: block; font-size: 8px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.5px; font-weight: bold; }
    .info-card span { font-size: 10px; font-weight: bold; color: #fff; line-height: 1.3; display: block; word-break: break-word; }

    /* Add Subscription Button */
    .sub-btn { background: var(--card-bg); border: 1px solid var(--border-color); padding: 16px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .sub-btn:hover { border-color: #fff; }
    .sub-btn-title { font-size: 13px; font-weight: 900; letter-spacing: 0.5px; color: #fff; }
    .sub-btn-sub { font-size: 9px; color: var(--text-muted); margin-top: 3px; }
    .plus-icon { background: #1f232d; border: 1px solid var(--border-color); color: #fff; width: 32px; height: 32px; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 16px; font-weight: bold; }

    /* Bottom Navigation Bar */
    .nav-bar { position: absolute; bottom: 0; width: 100%; height: 65px; background: var(--bg-color); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; }
    .nav-item { color: var(--text-muted); font-size: 10px; text-align: center; font-weight: 700; text-decoration: none; cursor: pointer; letter-spacing: 1px; }
    .nav-item.active { color: #fff; }
  </style>
</head><body>
<div class="app-container">
  <div class="header">
    <span>HOME</span>
    <div class="header-right">
      <span>🔔</span>
      <span>EN</span>
    </div>
  </div>

  <div class="content">
    <div class="status-bar">
      <span>■ OFFLINE</span>
      <span>LAST REFRESHED JUST NOW</span>
    </div>

    <!-- TIMER SECTION WITH DIAL -->
    <div class="timer-section">
      <div class="dial-ring"></div>
      <div class="skull-icon">💀</div>
      <div class="timer-val" id="time-left">2H 36M</div>
      <div class="timer-label">TIME LEFT</div>
    </div>

    <!-- KEY BOX -->
    <div class="key-box">
      <span>KEY <strong id="current-key" style="margin-left: 5px;">PHTM-162C-189E-9677</strong></span>
      <button class="copy-btn" onclick="copyKey()">COPY</button>
    </div>

    <!-- INFO CARDS -->
    <div class="info-grid">
      <div class="info-card">
        <label>ACTIVATED</label>
        <span id="activated-date">31 Oct 2026</span>
      </div>
      <div class="info-card">
        <label>EXPIRES</label>
        <span id="expires-date">31 Oct 2026</span>
      </div>
      <div class="info-card">
        <label>DEVICE</label>
        <span>TECNO KN3 · Android</span>
      </div>
    </div>

    <!-- ADD SUBSCRIPTION (OPENS HAPP PROXY APP) -->
    <div class="sub-btn" onclick="openHappApp()">
      <div>
        <div class="sub-btn-title">ADD SUBSCRIPTION</div>
        <div class="sub-btn-sub">opens your vpn app with your key ready</div>
      </div>
      <div class="plus-icon">+</div>
    </div>

  </div>

  <!-- Bottom Navigation Bar -->
  <div class="nav-bar">
    <a href="/home" class="nav-item active">HOME</a>
    <a href="/features" class="nav-item">FEATURES</a>
    <a href="/manage" class="nav-item">MANAGE</a>
  </div>
</div>

<script>
  window.onload = function() {
    const savedKey = localStorage.getItem('drake_active_key');
    if (savedKey) {
      document.getElementById('current-key').innerText = savedKey;
      fetchSessionDetails(savedKey);
    }
  };

  function fetchSessionDetails(key) {
    fetch('/api/session-info', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: key })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        const actDate = new Date(data.activated_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        const expDate = new Date(data.expires_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        document.getElementById('activated-date').innerText = actDate;
        document.getElementById('expires-date').innerText = expDate;
      }
    });
  }

  function copyKey() {
    const keyText = document.getElementById('current-key').innerText;
    navigator.clipboard.writeText(keyText);
    alert("Key copied to clipboard!");
  }

  function openHappApp() {
    const key = document.getElementById('current-key').innerText;
    if(!key) {
      alert("No active key found!");
      return;
    }
    // Happ proxy app deep-link trigger
    window.location.href = `happ://add?key=${key}&server=drake-panel`;
  }
</script>
</body>
</html>
